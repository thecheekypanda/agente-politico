name: Ingestion

on:
  schedule:
    # Daily at 06:00 UTC — keeps the Supabase free tier from pausing and
    # matches the "daily ingestion cron" decision in CLAUDE.md.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Ingest iniciativas (openAR)
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: npm run ingest:iniciativas --workspace=pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Scoped to the current legislature — fetching full history (27k+
          # records back to the API's start) trips openAR's rate limit.
          # Bump this when a new legislature starts (roughly once every 4 years).
          LEGISLATURA: 'XVII'

      - name: Ingest votacoes (openAR)
        # Runs after iniciativas — votacoes.iniciativa_id has an FK to
        # iniciativas(id), and a step failure above already halts the job.
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: npm run ingest:votacoes --workspace=pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEGISLATURA: 'XVII'

      - name: Resolve canonical parlamento.pt URLs
        # Cross-checks every iniciativa still missing a canonical_url against
        # parlamento.pt's own DetalheIniciativa page before it's ever shown
        # to a user as a citation (CLAUDE.md: citations must resolve to the
        # official source, not just openAR).
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: npm run resolve:canonical-urls --workspace=pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Supabase not configured yet
        if: ${{ secrets.SUPABASE_URL == '' || secrets.SUPABASE_SERVICE_ROLE_KEY == '' }}
        run: |
          echo "::notice::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY repo secrets are not set, so there's nowhere to write ingested data yet — skipping. See GETTING_STARTED.md Step 11."

      # Every ingestion step above fails loudly on a bad HTTP status, a
      # schema mismatch, or an unexpectedly empty payload (see
      # pipeline/src/openar-client.ts) — a failed step lands here rather
      # than relying on GitHub's own (opt-in, easy-to-miss) failure emails.
      # Comments on an existing open issue instead of opening a new one
      # each day so a multi-day outage doesn't spam the issue tracker.
      - name: Open or update an issue on ingestion failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'ingestion-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Ingestion workflow run failed: ${runUrl}\n\nThe pipeline is designed to fail loudly — a bad HTTP status, a schema mismatch, or an unexpectedly empty payload — rather than silently ingest nothing or garbage. Check the run logs for which step failed and why.`;

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Ingestion failure',
                body,
                labels: [label],
              });
            }
