name: Debug (temporary, manual only)

on:
  workflow_dispatch:
    inputs:
      iniciativa_id:
        description: 'iniciativa id to fetch raw from openAR'
        required: false
        default: '356479'

jobs:
  fetch-raw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx src/debug-fetch-raw.ts "${{ github.event.inputs.iniciativa_id }}"
        working-directory: pipeline
